<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" src="" alt="." id="avatar">
            <h1 class="profile-name" id="nome"></h1>
            <h2 class="profile-username" id="usuario"></h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4 >Repositórios</h4>
                    <span id="repositorios"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="seguidores"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="seguindo"></span>
                </li>
            </ul>
            <a href="#" class="profile-link" id="pagina" target="_blank">Ver no Github</a>
        </div>
    </header>

    <script src="/scripts/main.js"></script>
</body>
</html>
