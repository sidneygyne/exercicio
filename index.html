<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css
    ">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <div class="container">
        <form id="formulario-pedido">
            <div class="row mt-5">
                <h4 class="">Dados básicos</h4>
            </div>
            <div class="row">
                <div class="col-3">
                    <input type="text" class="form-control" id="nome" placeholder="Nome" min="2" max="30">
                    <div class="invalid-feedback">Digite seu nome</div>
                </div>
                <div class="col-5">
                    <input type="text" class="form-control" id="sobrenome" placeholder="Sobrenome" min="2" max="30">
                    <div class="invalid-feedback">Digite seu sobrenome</div>
                </div>
                <div class="col-4">
                    <input type="email" class="form-control" id="email" placeholder="E-mail">
                    <div class="invalid-feedback">Digite seu e-mail</div>
                </div>
            </div>
            <div class="row mt-5">
                <h4>Dados da entrega</h4>
            </div>
            <div class="row mb-5">
                <div class="col-3 d-flex">
                    <input type="text" class="form-control" placeholder="CEP" id="cep">
                    <button type="button" class="btn btn-primary" id="btn-buscar-cep">
                        <i class="bi bi-search"></i>
                        <span class="d-none spinner-border spinner-border-sm"></span>
                    </button>
                    <div class="invalid-feedback">Digite seu cep</div>
                </div>
                <div class="col-7">
                    <input type="text" class="form-control" placeholder="Endereço" id="logradouro">
                    <div class="invalid-feedback">Digite o cep para carregar automaticamente o nome da sua rua</div>
                </div>
                <div class="col-2">
                    <input type="number" class="form-control" placeholder="Número" id="numero" min="0">
                    <div class="invalid-feedback">Digite o número da sua residência, se nao tiver número digite "0"</div>
                </div>
            </div>
            <button type="submit" class="btn btn-success">Enviar pedido</button>

        </form>
    </div>
    <script src="./scripts/jquery.js"></script>
    <script src="./scripts/jquery.mask.min.js"></script>
    <script src="./scripts/main.js"></script>
</body>

</html>
